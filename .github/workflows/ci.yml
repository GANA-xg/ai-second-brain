name: CI

# Runs on every pull request targeting main or develop. Branch protection
# should require the "Backend tests" and "Frontend build" checks so a red
# pipeline blocks the merge button (see docs/deployment.md).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real service containers so the suite runs against the same engines used
    # in production rather than only against mocks.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: secondbrain
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: ai_second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondbrain -d ai_second_brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The qdrant image ships no shell utilities, so it has no container
      # health-cmd; the "Wait for Qdrant" step below polls it from the runner.
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333

    env:
      # Non-secret values: these point at throwaway CI containers that are
      # destroyed when the job ends. Nothing here is reused anywhere else.
      APP_NAME: AI Second Brain
      ENV: test
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ci-only-not-a-real-secret-key
      ALGORITHM: HS256
      BCRYPT_ROUNDS: "4" # keep password hashing fast in CI
      DATABASE_URL: postgresql://secondbrain:ci-postgres-password@localhost:5432/ai_second_brain_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: chunk_embeddings_ci
      UPLOAD_ROOT: storage
      CACHE_ENABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only torch wheel first, exactly like backend/Dockerfile,
          # so pip does not pull the ~2GB CUDA bundle on a GPU-less runner.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1
          pip install -r requirements-dev.txt

      - name: Run linter (ruff)
        run: ruff check .

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz > /dev/null 2>&1; then
              echo "Qdrant is ready."
              exit 0
            fi
            echo "Waiting for Qdrant ($i/30)..."
            sleep 2
          done
          echo "Qdrant did not become ready in time." >&2
          exit 1

      - name: Verify database migrations apply cleanly
        run: alembic upgrade head

      - name: Run pytest
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (next lint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
        run: npm run build
