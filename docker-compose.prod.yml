# Production compose file — deployed to the GCP VM by .github/workflows/deploy.yml.
#
# Unlike docker-compose.yml (which builds from source for local dev), this file
# only ever *pulls* pre-built, SHA-tagged images from GHCR. IMAGE_TAG,
# BACKEND_IMAGE and FRONTEND_IMAGE are supplied by /opt/ai-second-brain/.env,
# which the deploy workflow rewrites on every run.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-secondbrain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_second_brain_db}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  APP_NAME: ${APP_NAME:-AI Second Brain}
  ENV: ${ENV:-production}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-INFO}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
  UPLOAD_ROOT: ${UPLOAD_ROOT:-storage}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunk_embeddings}
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  LLM_MODEL: ${LLM_MODEL:-google/gemini-2.0-flash-lite}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_second_brain_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondbrain} -d ${POSTGRES_DB:-ai_second_brain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  backend_storage:
